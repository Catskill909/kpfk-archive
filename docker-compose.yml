# For local runs with plain `docker compose`. On Coolify use the Dockerfile build
# pack and configure storage in the UI — see docs/DEPLOYMENT.md.
#
# Every name here is kpfk-*, never wbai-*: this repo is a copy of WBAI's, and a
# compose file still naming wbai-archive would, on a host that also runs WBAI,
# collide with its container and attach WBAI's volume. (The server refuses to
# boot on another station's data dir, so that fails loudly — but don't rely on it.)
services:
  kpfk-archive:
    build: .
    image: kpfk-archive:latest
    container_name: kpfk-archive
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # One directory for everything the server persists; same string as the
      # mount below. See .env.example.
      - DATA_DIR=/app/data
      # Unset = the studio does not exist. Passed through from your shell/.env.
      - STUDIO_PASSWORD
    # Host port 8081, so it cannot collide with a WBAI container on 8080.
    ports:
      - "8081:8080"
    volumes:
      # Usage counters (the studio's stats) and the accepted Pacifica snapshots.
      # Coolify has been observed NOT honouring this block — configure the mount
      # in its Storages UI instead and confirm with /healthz: `storage.instanceId`
      # must not change across a redeploy.
      - kpfk-archive-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kpfk-archive-data:
